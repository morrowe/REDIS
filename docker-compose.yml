services:
  redis:
    image: redis:7-alpine
    container_name: redis-task-manager
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: redis-task-app
    command: ["npm", "start"]
    ports:
      - "3000:3000"
    environment:
      REDIS_URL: redis://redis:6379
      PORT: 3000
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: redis-task-worker
    command: ["npm", "run", "worker"]
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
